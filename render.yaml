services:
  - type: web
    name: mail-verschieben
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: NODE_VERSION
        value: "22"
